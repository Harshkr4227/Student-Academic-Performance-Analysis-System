<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register — Sap</title>
  <script>
    document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'light');
  </script>
  <link rel="stylesheet" href="/styles/main.css" />
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="row-between" style="margin-bottom:1rem;">
        <a href="/pages/index.html" style="font-weight:800; font-size:1.1rem;">Sap</a>
        <button type="button" class="btn btn-secondary btn-sm" data-theme-toggle>🌙 Dark</button>
      </div>
      <h2>University Registration</h2>
      <p class="muted">Create a Faculty or Student portal account</p>
      <form id="registerForm">
        <div class="role-toggle">
          <label><input type="radio" name="role" value="student" checked /> Student</label>
          <label><input type="radio" name="role" value="teacher" /> Faculty / Teacher</label>
        </div>
        <div class="form-group">
          <label>First Name</label>
          <input name="firstName" class="input" required />
        </div>
        <div class="form-group">
          <label>Last Name</label>
          <input name="lastName" class="input" required />
        </div>
        <div id="studentOnlyFields">
          <div class="form-group">
            <label>University Roll No (UnvRollNo)</label>
            <input id="rollNo" name="rollNo" class="input" placeholder="e.g. 12030523025" required />
          </div>
          <div class="form-group">
            <label>Current Semester (1–8)</label>
            <input id="currentSemester" name="currentSemester" type="number" min="1" max="8" value="5" class="input" required />
          </div>
        </div>
        <div class="form-group">
          <label>Department / Stream</label>
          <input name="department" class="input" value="Computer Science and Engineering(Data Science)" required />
        </div>
        <div class="form-group">
          <label>Email</label>
          <input name="email" type="email" class="input" required />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input name="password" type="password" minlength="6" class="input" required />
        </div>
        <div class="form-group">
          <label>Confirm Password</label>
          <input name="confirmPassword" type="password" minlength="6" class="input" required />
        </div>
        <button type="submit" class="btn btn-primary btn-block">Create Account</button>
      </form>
      <p class="muted" style="margin-top:1rem; text-align:center;">
        Already registered? <a href="/pages/login.html">Sign In</a>
      </p>
    </div>
  </div>
  <script type="module" src="/scripts/auth.js"></script>
</body>
</html>
