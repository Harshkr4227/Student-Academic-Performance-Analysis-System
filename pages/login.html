<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portal Login — Sap</title>
  <script>
    document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'light');
  </script>
  <link rel="stylesheet" href="/styles/main.css" />
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="row-between" style="margin-bottom:1.25rem;">
        <a href="/pages/index.html" style="font-weight:800; font-size:1.1rem;">Sap</a>
        <button type="button" class="btn btn-secondary btn-sm" data-theme-toggle>🌙 Dark</button>
      </div>
      <h2>Portal Sign In</h2>
      <p class="muted">Enter your university email and password</p>
      <form id="loginForm">
        <div class="form-group">
          <label>University Email</label>
          <input name="email" type="email" class="input" placeholder="e.g. faculty@bcrec.ac.in" required />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input name="password" type="password" class="input" required />
        </div>
        <button type="submit" class="btn btn-primary btn-block">Sign In</button>
      </form>
      <p class="muted" style="margin-top:1.25rem; text-align:center;">
        New user? <a href="/pages/register.html">Create an account</a>
      </p>
    </div>
  </div>
  <script type="module" src="/scripts/auth.js"></script>
</body>
</html>
